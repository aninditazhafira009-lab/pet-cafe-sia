<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Cafe SIA - Kas Kecil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50/30 p-4 md:p-8 min-h-screen text-gray-800">
    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-gradient-to-r from-amber-400 to-rose-400 p-6 rounded-2xl text-white shadow-lg">
            <h1 class="text-3xl font-bold">?? Pet Cafe SIA</h1>
            <p class="text-amber-100 text-sm mt-1">Sistem Informasi Akuntansi Kas Kecil (Imprest Fund System)</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-100">
                <span class="text-xs font-bold text-gray-400 uppercase">TOTAL PEMASUKAN</span>
                <h3 id="stateIncome" class="text-2xl font-black text-emerald-600 mt-1">Rp 0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-100">
                <span class="text-xs font-bold text-gray-400 uppercase">TOTAL PENGELUARAN</span>
                <h3 id="stateExpense" class="text-2xl font-black text-rose-500 mt-1">Rp 0</h3>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-100">
                <span class="text-xs font-bold text-gray-400 uppercase">SISA SALDO KAS KECIL</span>
                <h3 id="stateBalance" class="text-2xl font-black text-amber-600 mt-1">Rp 0</h3>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-amber-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4">?? Form Input Transaksi Kas Kecil</h2>
            <form id="txForm" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Jenis Transaksi</label>
                    <select id="jenisTransaksi" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                        <option value="Pengeluaran Kas Kecil (Expense)">Pengeluaran Kas Kecil (Expense)</option>
                        <option value="Pengisian Kembali Kas Kecil (Replenishment)">Pengisian Kembali Kas Kecil (Replenishment)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Nominal (Rp)</label>
                    <input type="number" id="nominal" placeholder="Contoh: 150000" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Kode & Nama Akun SIA</label>
                    <select id="kodeAkun" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                        <option value="">-- Pilih Kode & Nama Akun --</option>
                        <option value="1-1001">1-1001 - Kas Kecil (Petty Cash Vault)</option>
                        <option value="5-1001">5-1001 - Beban Perlengkapan Hewan & Cafe</option>
                        <option value="5-1002">5-1002 - Beban Makanan & Konsumsi Satwa</option>
                        <option value="5-1003">5-1003 - Beban Pemeliharaan & Grooming</option>
                        <option value="5-1004">5-1004 - Beban Kebersihan & Sanitasi</option>
                        <option value="5-1005">5-1005 - Beban Transportasi & Kurir</option>
                        <option value="5-1006">5-1006 - Beban Listrik, Air & Internet</option>
                        <option value="5-1099">5-1099 - Beban Operasional Lain-Lain</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Vendor / Penerima</label>
                    <input type="text" id="vendor" placeholder="Petshop Jaya / Supplier Kopi" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Nomor Nota / Invoice</label>
                    <input type="text" id="nomorNota" placeholder="INV-2026-001" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Tanggal Transaksi</label>
                    <input type="date" id="tanggal" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Nama Kasir / Petugas SIA</label>
                    <input type="text" id="namaKasir" value="anin" class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Keterangan / Memotext</label>
                    <input type="text" id="keterangan" placeholder="Peruntukan spesifik unit barang..." class="w-full p-2.5 bg-gray-50 border rounded-lg text-sm" required>
                </div>
                <div class="md:col-span-2 mt-2">
                    <button type="submit" id="btnSubmit" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl shadow transition">
                        ?? Simpan Transaksi & Update SIA
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-amber-100">
            <h2 class="text-lg font-bold text-gray-800 mb-4">?? Catatan Riwayat Transaksi Kas Kecil</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-amber-50 border-b border-amber-100 text-gray-600">
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Jenis</th>
                            <th class="p-3">Keterangan</th>
                            <th class="p-3">Vendor</th>
                            <th class="p-3">Nominal</th>
                            <th class="p-3">Kasir</th>
                        </tr>
                    </thead>
                    <tbody id="txTable">
                        <tr><td colspan="6" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zpddzahjzzaaryxlocms.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwZGR6YWhqenphYXJ5eGxvY21zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MD... ";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadTransactions() {
            try {
                const { data, error } = await supabase.from("transaksi_kas_kecil").select("*").order("id", { ascending: false });
                if (error) throw error;

                const tbody = document.getElementById("txTable");
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Belum ada transaksi.</td></tr>`;
                }

                let totalInc = 0, totalExp = 0;

                data.forEach(item => {
                    const nominalNum = Number(item.nominal) || 0;
                    if (item.jenis_transaksi && item.jenis_transaksi.includes("Replenishment")) {
                        totalInc += nominalNum;
                    } else {
                        totalExp += nominalNum;
                    }

                    const tr = document.createElement("tr");
                    tr.className = "border-b border-gray-100 hover:bg-amber-50/50";
                    tr.innerHTML = `
                        <td class="p-3 font-mono">${item.tanggal || "-"}</td>
                        <td class="p-3"><span class="px-2 py-1 bg-amber-100 text-amber-800 rounded text-xs font-bold">${item.jenis_transaksi || "-"}</span></td>
                        <td class="p-3 font-medium">${item.keterangan || "-"}</td>
                        <td class="p-3 text-gray-600">${item.vendor || "-"}</td>
                        <td class="p-3 font-bold text-rose-600">Rp ${nominalNum.toLocaleString("id-ID")}</td>
                        <td class="p-3 text-gray-500">${item.nama_kasir || "-"}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById("stateIncome").innerText = `Rp ${totalInc.toLocaleString("id-ID")}`;
                document.getElementById("stateExpense").innerText = `Rp ${totalExp.toLocaleString("id-ID")}`;
                document.getElementById("stateBalance").innerText = `Rp ${(totalInc - totalExp).toLocaleString("id-ID")}`;
            } catch (err) {
                console.error("Load Error:", err);
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById("btnSubmit");
            btn.innerText = "? Menyimpan...";
            btn.disabled = true;

            const newTx = {
                jenis_transaksi: document.getElementById("jenisTransaksi").value,
                nominal: parseFloat(document.getElementById("nominal").value) || 0,
                kode_akun: document.getElementById("kodeAkun").value,
                vendor: document.getElementById("vendor").value,
                nomor_nota: document.getElementById("nomorNota").value,
                tanggal: document.getElementById("tanggal").value,
                nama_kasir: document.getElementById("namaKasir").value,
                keterangan: document.getElementById("keterangan").value
            };

            const { data, error } = await supabase.from("transaksi_kas_kecil").insert([newTx]);

            btn.disabled = false;
            btn.innerText = "?? Simpan Transaksi & Update SIA";

            if (error) {
                alert("Gagal simpan: " + error.message);
            } else {
                alert("? Transaksi Berhasil Disimpan!");
                document.getElementById("txForm").reset();
                document.getElementById("namaKasir").value = "anin";
                document.getElementById("tanggal").valueAsDate = new Date();
                loadTransactions();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("tanggal").valueAsDate = new Date();
            loadTransactions();
        });
    </script>
</body>
</html>
