<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Cafe' de Anin - SIA Kas Kecil</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="bg-white p-6 rounded-xl shadow-sm flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Pet Cafe' de Anin</h1>
        <p class="text-sm text-slate-500">Sistem Informasi Akuntansi Kas Kecil (Petty Cash)</p>
      </div>
      <button onclick="resetData()" class="px-3 py-1.5 text-xs text-red-600 border border-red-200 rounded hover:bg-red-50">
        Reset Data
      </button>
    </div>

    <!-- Ringkasan Saldo & Total -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-500">
        <p class="text-xs font-semibold text-slate-400 uppercase">Total Pendapatan</p>
        <p id="totalPendapatan" class="text-2xl font-bold text-emerald-600 mt-1">Rp 0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-rose-500">
        <p class="text-xs font-semibold text-slate-400 uppercase">Total Pengeluaran</p>
        <p id="totalPengeluaran" class="text-2xl font-bold text-rose-600 mt-1">Rp 0</p>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
        <p class="text-xs font-semibold text-slate-400 uppercase">Saldo Kas Kecil</p>
        <p id="saldoKas" class="text-2xl font-bold text-blue-600 mt-1">Rp 0</p>
      </div>
    </div>

    <!-- Form Input Transaksi -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Input Transaksi Kas Kecil</h2>
      <form id="transactionForm" onsubmit="tambahTransaksi(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="tanggal" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jenis Transaksi</label>
          <select id="jenis" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="penerimaan">Penerimaan (Pendapatan/Pengisian Kas)</option>
            <option value="pengeluaran">Pengeluaran (Beban/Biaya)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Kode & Akun</label>
          <select id="kodeAkun" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            <optgroup label="--- ASET ---">
              <option value="101 - Kas Kecil">101 - Kas Kecil</option>
              <option value="102 - Kas Bank">102 - Kas Bank</option>
              <option value="103 - Perlengkapan Cafe & Pet">103 - Perlengkapan Cafe & Pet</option>
            </optgroup>
            <optgroup label="--- KEWAJIBAN & EKUITAS ---">
              <option value="201 - Utang Usaha">201 - Utang Usaha</option>
              <option value="301 - Modal Pemilik">301 - Modal Pemilik</option>
            </optgroup>
            <optgroup label="--- PENDAPATAN ---">
              <option value="401 - Pendapatan Pet Care & Grooming">401 - Pendapatan Pet Care & Grooming</option>
              <option value="402 - Pendapatan Penjualan Makanan & Minuman">402 - Pendapatan Penjualan Makanan & Minuman</option>
              <option value="403 - Pendapatan Lain-lain">403 - Pendapatan Lain-lain</option>
            </optgroup>
            <optgroup label="--- BEBAN / PENGELUARAN ---">
              <option value="501 - Beban Makanan & Makanan Hewan">501 - Beban Makanan & Makanan Hewan</option>
              <option value="502 - Beban Perlengkapan Kebersihan">502 - Beban Perlengkapan Kebersihan</option>
              <option value="503 - Beban Listrik, Air & Internet">503 - Beban Listrik, Air & Internet</option>
              <option value="504 - Beban Pemeliharaan & Kesehatan Hewan">504 - Beban Pemeliharaan & Kesehatan Hewan</option>
              <option value="505 - Beban Transportasi & Konsumsi">505 - Beban Transportasi & Konsumsi</option>
              <option value="506 - Beban Lain-Lain">506 - Beban Lain-Lain</option>
            </optgroup>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah (Rp)</label>
          <input type="number" id="jumlah" min="1" placeholder="Contoh: 50000" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-slate-600 mb-1">Keterangan / Deskripsi</label>
          <input type="text" id="keterangan" placeholder="Contoh: Pembelian pakan kucing & pembersih lantai" required class="w-full p-2.5 text-sm border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg shadow transition duration-200">
            Simpan Transaksi
          </button>
        </div>
      </form>
    </div>

    <!-- Tabel Riwayat Mutasi Kas -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-bold text-slate-800 mb-4">Riwayat Mutasi Kas Kecil</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 border-b text-slate-600">
            <tr>
              <th class="p-3">Tanggal</th>
              <th class="p-3">Kode & Akun</th>
              <th class="p-3">Keterangan</th>
              <th class="p-3 text-right">Penerimaan</th>
              <th class="p-3 text-right">Pengeluaran</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelBody" class="divide-y divide-slate-100">
            <!-- Data transaksi di-render secara otomatis oleh JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Set tanggal default ke hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    // Mengambil data dari localStorage atau inisialisasi array kosong
    let transaksiList = JSON.parse(localStorage.getItem('petCafeTransaksi')) || [];

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
    }

    function simpanKeStorage() {
      localStorage.setItem('petCafeTransaksi', JSON.stringify(transaksiList));
      updateTampilan();
    }

    function tambahTransaksi(e) {
      e.preventDefault();

      const tanggal = document.getElementById('tanggal').value;
      const jenis = document.getElementById('jenis').value;
      const kodeAkun = document.getElementById('kodeAkun').value;
      const jumlah = parseFloat(document.getElementById('jumlah').value);
      const keterangan = document.getElementById('keterangan').value;

      const dataBaru = {
        id: Date.now(),
        tanggal,
        jenis,
        kodeAkun,
        jumlah,
        keterangan
      };

      transaksiList.push(dataBaru);
      simpanKeStorage();

      // Reset form
      document.getElementById('transactionForm').reset();
      document.getElementById('tanggal').valueAsDate = new Date();
    }

    function hapusTransaksi(id) {
      if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
        transaksiList = transaksiList.filter(item => item.id !== id);
        simpanKeStorage();
      }
    }

    function resetData() {
      if (confirm('Hapus seluruh data transaksi? Data yang terhapus tidak dapat dikembalikan.')) {
        transaksiList = [];
        simpanKeStorage();
      }
    }

    function updateTampilan() {
      const tbody = document.getElementById('tabelBody');
      tbody.innerHTML = '';

      let totalMasuk = 0;
      let totalKeluar = 0;

      transaksiList.forEach(item => {
        if (item.jenis === 'penerimaan') {
          totalMasuk += item.jumlah;
        } else {
          totalKeluar += item.jumlah;
        }

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50 border-b';
        tr.innerHTML = `
          <td class="p-3 text-slate-700">${item.tanggal}</td>
          <td class="p-3 font-medium text-slate-800">${item.kodeAkun}</td>
          <td class="p-3 text-slate-600">${item.keterangan}</td>
          <td class="p-3 text-right font-medium text-emerald-600">${item.jenis === 'penerimaan' ? formatRupiah(item.jumlah) : '-'}</td>
          <td class="p-3 text-right font-medium text-rose-600">${item.jenis === 'pengeluaran' ? formatRupiah(item.jumlah) : '-'}</td>
          <td class="p-3 text-center">
            <button onclick="hapusTransaksi(${item.id})" class="text-xs text-rose-500 hover:underline">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      if (transaksiList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada transaksi tersimpan.</td></tr>`;
      }

      // Update Angka Ringkasan
      document.getElementById('totalPendapatan').innerText = formatRupiah(totalMasuk);
      document.getElementById('totalPengeluaran').innerText = formatRupiah(totalKeluar);
      document.getElementById('saldoKas').innerText = formatRupiah(totalMasuk - totalKeluar);
    }

    // Render data saat halaman pertama kali dimuat
    updateTampilan();
  </script>
</body>
</html>
